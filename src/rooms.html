<!DOCTYPE html>
<html lang="zh-CN" class="acrylic-applied">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>房间列表 - CloudChat</title>
<link rel="stylesheet" href="/static/styles/all-styles.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#4a6cf7">
</head>
<body>
<div class="header">
  <h1>🏠 房间列表</h1>
  <p>浏览所有公开聊天房间</p>
  <a class="back-link" href="/">← 返回聊天室</a>
</div>

<div class="stats-bar" id="stats-bar" style="display:none;"></div>

<div class="controls">
  <input class="search-box" id="search" type="text" placeholder="🔍 搜索房间..." oninput="filter()">
</div>

<div id="loading" class="loading">⏳ 加载中...</div>
<ul id="room-list" class="room-list" style="display:none;"></ul>
<div id="empty" class="empty-state" style="display:none;">
  <div class="big-icon">🏠</div>
  <div id="empty-text">暂无公开房间</div>
</div>

<script>
let rooms = [];

async function load() {
  try {
    let r = await fetch("/api/rooms/list");
    let data = await r.json();
    rooms = Object.entries(data).map(([name, info]) => ({
      name,
      count: typeof info === "object" ? info.count || 0 : info || 0,
      hasPassword: typeof info === "object" && info.hasPassword
    }));
    rooms.sort((a, b) => b.count - a.count);
    document.getElementById("loading").style.display = "none";
    let bar = document.getElementById("stats-bar");
    let totalUsers = rooms.reduce((s, r) => s + r.count, 0);
    bar.innerHTML = '<span>🏠 ' + rooms.length + ' 个房间</span><span>👥 ' + totalUsers + ' 人在线</span>';
    bar.style.display = "flex";
    render();
  } catch(e) {
    document.getElementById("loading").textContent = "❌ 加载失败";
  }
}

function filter() {
  let q = document.getElementById("search").value.trim().toLowerCase();
  let filtered = q ? rooms.filter(r => r.name.toLowerCase().includes(q)) : rooms;
  renderList(filtered);
}

function render() {
  document.getElementById("search").value = "";
  renderList(rooms);
}

function renderList(list) {
  let container = document.getElementById("room-list");
  let empty = document.getElementById("empty");
  container.style.display = "none";
  empty.style.display = "none";
  if (list.length === 0) {
    document.getElementById("empty-text").textContent = document.getElementById("search").value ? "未找到匹配的房间" : "暂无公开房间";
    empty.style.display = "block";
    return;
  }
  container.innerHTML = "";
  list.forEach(r => {
    let item = document.createElement("li");
    item.className = "room-item";
    let icon = document.createElement("div");
    icon.className = "room-icon";
    icon.textContent = r.hasPassword ? "🔒" : "#";
    item.appendChild(icon);
    let info = document.createElement("div");
    info.className = "room-info";
    let nameRow = document.createElement("div");
    nameRow.className = "room-name";
    nameRow.textContent = "#" + r.name;
    if (r.hasPassword) {
      let lock = document.createElement("span");
      lock.className = "lock-badge";
      lock.textContent = "🔒";
      nameRow.appendChild(lock);
    }
    info.appendChild(nameRow);
    let meta = document.createElement("div");
    meta.className = "room-meta";
    meta.textContent = r.hasPassword ? "密码保护房间" : "公开房间";
    info.appendChild(meta);
    let count = document.createElement("div");
    count.className = "room-count";
    count.innerHTML = '<span class="online-dot"></span>' + r.count + ' <span>在线</span>';
    item.appendChild(info);
    item.appendChild(count);
    item.addEventListener("click", () => { window.location.href = "/#" + r.name; });
    container.appendChild(item);
  });
  container.style.display = "";
}

load();
</script>

</body>
</html>
