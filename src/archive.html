<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>版本存档 - CloudChat</title>
<link rel="stylesheet" href="/static/styles/all-styles.css">
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#4a6cf7">
</head>
<body>

<div class="header">
  <h1>📦 版本存档</h1>
  <p>CloudChat 所有历史版本的归档文件</p>
  <a class="back-link" href="/">← 返回聊天室</a>
  <a class="back-link" href="/changelog">📋 更新日志</a>
</div>

<div id="loading">加载中...</div>
<div id="empty">暂无存档版本</div>
<div class="version-list" id="version-list"></div>

<script>
async function loadVersions() {
  let loading = document.getElementById("loading");
  let empty = document.getElementById("empty");
  let list = document.getElementById("version-list");

  try {
    let r = await fetch("/api/archive/list");
    let versions = await r.json();
    loading.style.display = "none";

    if (!versions || versions.length === 0) {
      empty.style.display = "block";
      return;
    }

    empty.style.display = "none";
    list.innerHTML = versions.map(v => {
      let date = new Date(v.timestamp);
      let dateStr = date.getFullYear() + "/" +
        String(date.getMonth() + 1).padStart(2, "0") + "/" +
        String(date.getDate()).padStart(2, "0") + " " +
        String(date.getHours()).padStart(2, "0") + ":" +
        String(date.getMinutes()).padStart(2, "0");
      let sizeStr = v.size < 1024 ? v.size + " B" :
        v.size < 1024 * 1024 ? (v.size / 1024).toFixed(1) + " KB" :
        (v.size / (1024 * 1024)).toFixed(1) + " MB";
      let desc = v.description || "";
      return '<div class="version-card">' +
        '<div class="v-icon">📦</div>' +
        '<div class="v-info">' +
          '<div class="v-name">' + escapeHtml(v.name) + '</div>' +
          (desc ? '<div class="v-desc">' + escapeHtml(desc) + '</div>' : '') +
          '<div class="v-date">' + dateStr + ' · ' + sizeStr + '</div>' +
        '</div>' +
        '<div class="v-actions">' +
          '<a href="/api/archive/download/' + encodeURIComponent(v.name) + '" download="' + v.name + '.zip">⬇ 下载</a>' +
        '</div>' +
      '</div>';
    }).join("");
  } catch (e) {
    loading.textContent = "加载失败: " + e.message;
  }
}

function escapeHtml(s) {
  var d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}

loadVersions();
</script>

<script src="/static/theme-switch.js"></script>
</body>
</html>
