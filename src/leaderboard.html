<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>积分排行榜 - CloudChat</title>
<link rel="stylesheet" href="/static/styles/all-styles.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#4a6cf7">
</head>
<body>

<div class="header">
  <h1>🏆 积分排行榜</h1>
  <p>CloudChat 财富榜 — 看看谁最富有</p>
  <a class="back-link" href="/">← 返回聊天室</a>
</div>

<div class="controls">
  <input class="search-box" id="search" type="text" placeholder="🔍 搜索用户..." oninput="render()">
  <select class="rank-filter" id="filter" onchange="render()">
    <option value="100">TOP 100</option>
    <option value="50">TOP 50</option>
    <option value="20">TOP 20</option>
    <option value="10">TOP 10</option>
    <option value="0">全部</option>
  </select>
</div>

<div id="loading" class="loading">⏳ 加载中...</div>
<ul id="leaderboard" class="leaderboard" style="display:none;"></ul>
<div id="empty" class="empty-state" style="display:none;">
  <div class="big-icon">📭</div>
  <div>暂无数据</div>
</div>

<script>
let allData = [];

async function load() {
  try {
    let r = await fetch("/api/points/all");
    let data = await r.json();
    allData = Object.entries(data).map(([name, points]) => ({ name, points }));
    allData.sort((a, b) => b.points - a.points);
    document.getElementById("loading").style.display = "none";
    render();
  } catch(e) {
    document.getElementById("loading").textContent = "❌ 加载失败: " + e.message;
  }
}

function getVipLevel(name) {
  if (!name) return null;
  let m = name.match(/\[VIP([1-9]|10|99)\]/i);
  if (m) return "VIP" + m[1];
  if (/\[MVP\]/i.test(name)) return "MVP";
  if (/\[V0\]/i.test(name)) return "V0";
  return null;
}

function render() {
  let q = document.getElementById("search").value.trim().toLowerCase();
  let limit = parseInt(document.getElementById("filter").value);
  let list = allData;
  if (q) list = list.filter(u => u.name.toLowerCase().includes(q));
  let container = document.getElementById("leaderboard");
  let empty = document.getElementById("empty");
  container.style.display = "none";
  empty.style.display = "none";
  if (list.length === 0) { empty.style.display = "block"; return; }
  let display = limit > 0 ? list.slice(0, limit) : list;
  container.innerHTML = "";
  display.forEach((u, i) => {
    let actualRank = allData.indexOf(u) + 1;
    let item = document.createElement("li");
    item.className = "rank-item" + (actualRank === 1 ? " top1" : actualRank === 2 ? " top2" : actualRank === 3 ? " top3" : "");
    let rankNum = document.createElement("div");
    rankNum.className = "rank-num";
    rankNum.textContent = actualRank <= 3 ? ["🥇","🥈","🥉"][actualRank-1] : actualRank;
    item.appendChild(rankNum);
    let avatar = document.createElement("div");
    avatar.className = "rank-avatar";
    avatar.textContent = u.name.charAt(0).toUpperCase();
    item.appendChild(avatar);
    let info = document.createElement("div");
    info.className = "rank-info";
    let nameRow = document.createElement("div");
    nameRow.className = "rank-name";
    nameRow.textContent = u.name;
    info.appendChild(nameRow);
    let vip = getVipLevel(u.name);
    if (vip) {
      let vb = document.createElement("span");
      vb.className = "vip-badge";
      vb.style.cssText = "background:linear-gradient(135deg,#f6d365,#fda085);color:#fff;font-size:10px;padding:0 5px;border-radius:3px;margin-left:4px;";
      vb.textContent = vip;
      nameRow.appendChild(vb);
    }
    let pts = document.createElement("div");
    pts.className = "rank-points";
    pts.innerHTML = Number(u.points).toLocaleString() + ' <span>积分</span>';
    item.appendChild(info);
    item.appendChild(pts);
    item.addEventListener("click", () => window.open("/user?name=" + encodeURIComponent(u.name), "_blank"));
    container.appendChild(item);
  });
  container.style.display = "";
}

load();
</script>
<script src="/static/theme-switch.js"></script>
</body>
</html>
