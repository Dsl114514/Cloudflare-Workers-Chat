<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>在线用户 - CloudChat</title>
<link rel="stylesheet" href="/static/styles/all-styles.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#4a6cf7">
</head>
<body>
<button id="theme-toggle-btn" class="theme-toggle-btn" title="切换主题 (经典/亚克力)" aria-label="切换主题">🎨</button>

<div class="header">
  <h1>👥 在线用户</h1>
  <p>看看谁在线上</p>
  <a class="back-link" href="/">← 返回聊天室</a>
</div>

<div id="loading" class="loading">⏳ 加载中...</div>
<div id="content" style="display:none;">
  <div class="total-bar" id="total-bar">
    <div class="total-num" id="total-num">0</div>
    <div class="total-label">当前在线</div>
  </div>
  <div id="room-groups"></div>
  <button class="refresh-btn" onclick="load()">🔄 刷新</button>
</div>
<div id="empty" class="empty-state" style="display:none;">
  <div class="big-icon">👻</div>
  <div>暂无在线用户</div>
</div>

<script>
async function load() {
  document.getElementById("loading").style.display = "block";
  document.getElementById("content").style.display = "none";
  document.getElementById("empty").style.display = "none";
  try {
    let r = await fetch("/api/rooms/list");
    let data = await r.json();
    let entries = Object.entries(data).map(([name, info]) => ({
      name,
      count: typeof info === "object" ? info.count || 0 : info || 0,
      hasPassword: typeof info === "object" && info.hasPassword
    })).filter(r => r.count > 0);
    entries.sort((a, b) => b.count - a.count);
    document.getElementById("loading").style.display = "none";
    if (entries.length === 0) { document.getElementById("empty").style.display = "block"; return; }
    let total = entries.reduce((s, r) => s + r.count, 0);
    document.getElementById("total-num").textContent = total;
    let groups = document.getElementById("room-groups");
    groups.innerHTML = "";
    entries.forEach((r, i) => {
      let group = document.createElement("div");
      group.className = "room-group";
      let header = document.createElement("div");
      header.className = "room-group-header";
      header.innerHTML = '<span class="online-dot"></span> #' + r.name + (r.hasPassword ? ' 🔒' : '') +
        '<span class="room-online">' + r.count + ' 人</span><span class="arrow' + (i === 0 ? ' open' : '') + '">▶</span>';
      let body = document.createElement("div");
      body.className = "room-group-body" + (i === 0 ? " open" : "");
      // 显示每个房间的在线人数（因无公开API获取具体用户名，显示人数统计）
      let grid = document.createElement("div");
      grid.className = "user-grid";
      for (let j = 0; j < Math.min(r.count, 20); j++) {
        let userItem = document.createElement("div");
        userItem.className = "user-item";
        userItem.innerHTML = '<span class="online-indicator"></span><span class="user-avatar">👤</span><span class="user-name">在线用户 ' + (j + 1) + '</span>';
        grid.appendChild(userItem);
      }
      if (r.count > 20) {
        let more = document.createElement("div");
        more.style.cssText = "font-size:12px;color:#999;text-align:center;padding:4px;";
        more.textContent = "还有 " + (r.count - 20) + " 位用户";
        body.appendChild(grid);
        body.appendChild(more);
      } else {
        body.appendChild(grid);
      }
      header.addEventListener("click", () => {
        body.classList.toggle("open");
        header.querySelector(".arrow").classList.toggle("open");
      });
      group.appendChild(header);
      group.appendChild(body);
      groups.appendChild(group);
    });
    document.getElementById("content").style.display = "block";
  } catch(e) {
    document.getElementById("loading").textContent = "❌ 加载失败";
  }
}
load();
</script>
<script src="/static/theme-switch.js"></script>
</body>
</html>
