<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>站点统计 - CloudChat</title>
<link rel="stylesheet" href="/static/styles/all-styles.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#4a6cf7">
</head>
<body>

<div class="header">
  <h1>📊 站点统计</h1>
  <p>CloudChat 实时数据概览</p>
  <a class="back-link" href="/">← 返回聊天室</a>
</div>

<div id="loading" class="loading">⏳ 加载中...</div>
<div id="content" style="display:none;">
  <div class="stats-grid" id="main-stats"></div>
  <div class="section-title">🏆 积分排行榜 TOP 10</div>
  <ul id="lb-top10" class="leaderboard-mini"></ul>
  <div style="text-align:center;margin-top:12px;">
    <a href="/leaderboard" style="display:inline-block;padding:8px 20px;background:#4a6cf7;color:#fff;border-radius:20px;text-decoration:none;font-size:13px;">查看完整排行榜 →</a>
  </div>
</div>

<script>
async function load() {
  try {
    let [roomsData, pointsData] = await Promise.all([
      fetch("/api/rooms/list").then(r => r.json()),
      fetch("/api/points/all").then(r => r.json())
    ]);
    let roomEntries = Object.entries(roomsData);
    let totalRooms = roomEntries.length;
    let totalOnline = roomEntries.reduce((s, [_, info]) => s + (typeof info === "object" ? info.count || 0 : info || 0), 0);
    let passwordRooms = roomEntries.filter(([_, info]) => typeof info === "object" && info.hasPassword).length;
    let pointsEntries = Object.entries(pointsData);
    let totalUsers = pointsEntries.length;
    let totalPoints = pointsEntries.reduce((s, [_, p]) => s + (Number(p) || 0), 0);
    document.getElementById("loading").style.display = "none";
    let mainStats = document.getElementById("main-stats");
    mainStats.innerHTML = '' +
      '<div class="stat-card"><div class="icon">🏠</div><div class="num">' + totalRooms + '</div><div class="label">房间总数</div></div>' +
      '<div class="stat-card"><div class="icon">👥</div><div class="num">' + totalOnline + '</div><div class="label">当前在线</div></div>' +
      '<div class="stat-card"><div class="icon">👤</div><div class="num">' + totalUsers + '</div><div class="label">注册用户</div></div>' +
      '<div class="stat-card"><div class="icon">💰</div><div class="num">' + totalPoints.toLocaleString() + '</div><div class="label">积分总量</div></div>';
    if (passwordRooms > 0) {
      mainStats.innerHTML += '<div class="stat-card"><div class="icon">🔒</div><div class="num">' + passwordRooms + '</div><div class="label">加密房间</div></div>';
    }
    document.getElementById("content").style.display = "block";
    let sorted = pointsEntries.sort((a, b) => b[1] - a[1]).slice(0, 10);
    let lb = document.getElementById("lb-top10");
    lb.innerHTML = "";
    sorted.forEach(([name, points], i) => {
      let item = document.createElement("li");
      item.className = "lb-item" + (i < 3 ? " top" + (i+1) : "");
      item.innerHTML = '<span class="lb-rank">' + (i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : '#' + (i+1)) + '</span>' +
        '<span class="lb-name">' + name + '</span><span class="lb-points">' + points.toLocaleString() + ' 分</span>';
      lb.appendChild(item);
    });
  } catch(e) {
    document.getElementById("loading").textContent = "❌ 加载失败";
  }
}
load();
</script>
<script src="/static/theme-switch.js"></script>
</body>
</html>
