<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>兑换积分 - CloudChat</title>
<link rel="stylesheet" href="/static/styles/all-styles.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#4a6cf7">
</head>
<body>
<button id="theme-toggle-btn" class="theme-toggle-btn" title="切换主题 (经典/亚克力)" aria-label="切换主题">🎨</button>

<div class="header">
  <h1>🎁 积分兑换</h1>
  <p>输入兑换码，领取积分奖励</p>
  <a class="back-link" href="/">← 返回聊天室</a>
</div>

<div class="card">
  <!-- 当前用户 -->
  <div class="user-info" id="user-info" style="display:none">
    <div class="avatar" id="avatar"></div>
    <div class="info">
      <div class="name" id="username"></div>
      <div class="pts-label">当前积分</div>
      <div class="pts" id="current-points">-</div>
    </div>
  </div>

  <div class="label">请输入兑换码</div>
  <div class="input-group">
    <input type="text" id="code-input" placeholder="如 VIP-A1B2C3D4" maxlength="30" autocomplete="off" spellcheck="false">
    <button id="redeem-btn" onclick="doRedeem()">兑换</button>
  </div>

  <div class="result-box" id="result-box"></div>
</div>

<div class="history" id="history-section" style="display:none">
  <h3>📋 兑换记录</h3>
  <div id="history-list"></div>
</div>

<script>
let userName = localStorage.getItem("chat_user") || "";

async function loadUser() {
  if (!userName) {
    let name = prompt("请输入你的用户名：");
    if (name && name.trim()) {
      userName = name.trim();
      localStorage.setItem("chat_user", userName);
    }
  }
  if (!userName) {
    document.querySelector("#code-input").disabled = true;
    document.querySelector("#redeem-btn").disabled = true;
    return;
  }
  document.querySelector("#user-info").style.display = "flex";
  document.querySelector("#avatar").textContent = userName.charAt(0).toUpperCase();
  document.querySelector("#username").textContent = userName;
  loadPoints();
  loadHistory();
}

async function loadPoints() {
  try {
    let r = await fetch("/api/points/get?name=" + encodeURIComponent(userName));
    let data = await r.json();
    let pts = Number(data.points || 0);
    document.querySelector("#current-points").textContent = pts.toLocaleString();
  } catch(e) {
    document.querySelector("#current-points").textContent = "?";
  }
}

async function doRedeem() {
  let input = document.querySelector("#code-input");
  let btn = document.querySelector("#redeem-btn");
  let resultBox = document.querySelector("#result-box");

  let code = input.value.trim();
  if (!code) { showResult("请输入兑换码", false); return; }
  if (!userName) { showResult("请先设置用户名", false); return; }

  btn.disabled = true;
  btn.textContent = "兑换中...";
  resultBox.className = "result-box";
  resultBox.style.display = "none";

  try {
    let r = await fetch("/api/redeem", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({code, user: userName})
    });
    let data = await r.json();
    if (data.ok) {
      showResult('兑换成功！<span class="pts-highlight">+' + Number(data.points).toLocaleString() + ' 积分</span>当前积分: ' + Number(data.total).toLocaleString(), true);
      input.value = "";
      loadPoints();
      loadHistory();
    } else {
      showResult(data.error || "兑换失败", false);
    }
  } catch(e) {
    showResult("网络错误: " + e.message, false);
  }

  btn.disabled = false;
  btn.textContent = "兑换";
}

function showResult(msg, success) {
  let box = document.querySelector("#result-box");
  box.className = "result-box " + (success ? "success" : "error");
  box.innerHTML = msg;
  box.style.display = "block";
}

async function loadHistory() {
  // 兑换记录存储在 localStorage
  let history = JSON.parse(localStorage.getItem("redeem_history") || "[]");
  let section = document.querySelector("#history-section");
  let list = document.querySelector("#history-list");

  if (history.length === 0) {
    // 从服务端获取
    try {
      let r = await fetch("/api/admin/redeem/list?key=" + encodeURIComponent(localStorage.getItem("admin_key") || ""));
      if (r.ok) {
        let allCodes = await r.json();
        let userCodes = Object.entries(allCodes).filter(([_, info]) => info.usedBy === userName);
        if (userCodes.length > 0) {
          history = userCodes.map(([code, info]) => ({
            code, points: info.points, time: info.usedAt
          }));
          localStorage.setItem("redeem_history", JSON.stringify(history));
        }
      }
    } catch(e) {}
  }

  if (history.length === 0) {
    section.style.display = "none";
    return;
  }

  section.style.display = "block";
  list.innerHTML = history.sort((a, b) => b.time - a.time).map(h =>
    '<div class="history-item">' +
      '<span class="h-code">' + h.code + '</span>' +
      '<span class="h-pts">+' + Number(h.points).toLocaleString() + '</span>' +
      '<span class="h-time">' + (h.time ? new Date(h.time).toLocaleString() : "") + '</span>' +
    '</div>'
  ).join("");
}

loadUser();
</script>
<script src="/static/theme-switch.js"></script>
</body>
</html>
