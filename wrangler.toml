name = "cloudflare-workers-chat"
compatibility_date = "2024-01-01"

main = "src/index.mjs"

workers_dev = true

routes = [
  { pattern = "dslirc.indevs.in/*", zone_name = "dslirc.indevs.in" },
  { pattern = "chat.dslirc.indevs.in/*", zone_name = "dslirc.indevs.in" },
  { pattern = "community.dslirc.indevs.in", zone_name = "dslirc.indevs.in", custom_domain = true, enabled = true, previews_enabled = false },
  { pattern = "chat.dslirc.indevs.in", zone_name = "dslirc.indevs.in", custom_domain = true, enabled = true, previews_enabled = false },
  { pattern = "origin.dslirc.indevs.in", zone_name = "dslirc.indevs.in", custom_domain = true, enabled = true, previews_enabled = false },
  { pattern = "chatnew.dslirc.indevs.in", zone_name = "dslirc.indevs.in", custom_domain = true, enabled = true, previews_enabled = false },
  { pattern = "chat.dslirc.indevs.in", zone_name = "dslirc.indevs.in", custom_domain = true, enabled = true, previews_enabled = false },
]

[durable_objects]
bindings = [
  { name = "rooms", class_name = "ChatRoom" },
  { name = "registry", class_name = "RoomRegistry" },
  { name = "archive", class_name = "VersionArchive" },
  { name = "filebucket", class_name = "FileBucket" },
]

[[rules]]
type = "Data"
globs = ["**/*.html", "**/*.js", "**/*.css"]
fallthrough = false

# Indicate that you want the ChatRoom class to be callable as a Durable Object.
[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1

[vars]
AI_BASE_URL = "https://api.deepseek.com/v1"
AI_MODEL = "deepseek-v4-flash"
AI_SYSTEM_PROMPT = "你是一个友好的助手，请用中文回答。"
# 独立销毁口令：聊天框输入 /destroy <口令> 可销毁当前房间（仅此命令生效，不授予其他权限）
DESTROY_KEY = "lxy130523"
# 应急回滚功能所需（由 Dsl 侧配置）：CF_ACCOUNT_ID、CF_SCRIPT_NAME；CF_API_TOKEN 用 wrangler secret put 配置
# 注意：Durable Objects 类已在 Cloudflare 侧注册，migrations 已移除。
# 若在全新账号部署新 fork 时报类不存在，请重新加回：
#   [[migrations]]
#   tag = "v1"
#   new_sqlite_classes = ["ChatRoom", "RoomRegistry", "VersionArchive", "FileBucket"]
